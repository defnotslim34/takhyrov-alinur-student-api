# Spring Application Configuration
spring.application.name=takhyrov-alinur-student-api
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studentdb}
spring.datasource.username=${DB_USER:takhyrov}
spring.datasource.password=${DB_PASSWORD:takhyrov_secret_38110}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Student & Author Metadata
app.author.name=Alinur Takhyrov
app.author.student-id=38110
app.author.github=defnotslim34

# Actuator & Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
